[project]
name = "mxspots"
version = "2026.8.4"
description = "Spot Analysis for Assessing Quality of MX Diffraction Frames"
authors = [
    {name = "Michel Fodje", email = "michel4j@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "mxio  (>=2025.10.7)",
    "numpy (>=2.5.2,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "matplotlib>=3.11.1,<4.0.0",
]

[project.scripts]
"mxspots.findspots" = "mxspots.cli:findspots_main"
"mxspots.score"     = "mxspots.cli:score_main"

[build-system]
requires = ["scikit-build-core>=1.0.0"]
build-backend = "scikit_build_core.build"


[tool.scikit-build]
build.verbose = true
cmake.build-type = "Release"
wheel.packages = ["src/mxspots"]
sdist.include = ["tests/**", "csrc/**", "CMakeLists.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.cibuildwheel]
build = ["cp312-*", "cp313-*"]
skip = ["*-musllinux_i686", "*-manylinux_i686", "pp*"]
build-verbosity = 1
test-extras = ["dev"]
test-command = "pytest {project}/tests"

[tool.cibuildwheel.config-settings]
"cmake.define.PORTABLE_BUILD" = "ON"
"cmake.define.ENABLE_NATIVE_TUNING" = "OFF"
"cmake.build-type" = "Release"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
musllinux-x86_64-image = "musllinux_1_2"
musllinux-aarch64-image = "musllinux_1_2"
before-all = "which apk >/dev/null 2>&1 && apk add --no-cache libgomp || true"
